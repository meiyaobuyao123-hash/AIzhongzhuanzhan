<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>验证邮箱 · Prism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/suanli/tokens.css"/>
  <link rel="stylesheet" href="/suanli/styles.css"/>
  <link rel="stylesheet" href="/suanli/auth-pages.css"/>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script type="text/babel">
const { useState, useEffect } = React;

function VerifyEmailPage() {
  const [state, setState] = useState('loading'); // 'loading' | 'ok' | 'err'
  const [message, setMessage] = useState('正在验证你的邮箱…');
  const token = new URLSearchParams(location.search).get('token') || '';

  useEffect(() => {
    if (!token) {
      setState('err');
      setMessage('链接无效：缺少 token 参数。请检查邮件中的链接是否完整。');
      return;
    }
    fetch('/suanli-api/auth/verify-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    })
      .then(async (r) => {
        const data = await r.json().catch(() => ({}));
        if (r.ok) {
          setState('ok');
          setMessage('邮箱验证成功！3 秒后跳转到登录页…');
          setTimeout(() => { location.href = '/login'; }, 3000);
        } else {
          setState('err');
          const code = data?.error?.code;
          if (code === 'expired_verification_token') {
            setMessage('验证链接已过期（24 小时有效期）。请重新注册或联系管理员重发。');
          } else if (code === 'invalid_verification_token') {
            setMessage('验证链接无效或已被使用过。如果你已经验证成功，可以直接登录。');
          } else {
            setMessage(data?.error?.message || `验证失败（HTTP ${r.status}）`);
          }
        }
      })
      .catch((e) => {
        setState('err');
        setMessage('网络错误：' + (e.message || '请稍后重试'));
      });
  }, [token]);

  return (
    <div className="auth-shell">
      <div className="auth-brand">
        <div className="brand-prism" aria-hidden="true">
          <svg viewBox="0 0 200 200" width="180" height="180">
            <defs>
              <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor="#8B5CF6"/>
                <stop offset="50%" stopColor="#06B6D4"/>
                <stop offset="100%" stopColor="#EC4899"/>
              </linearGradient>
            </defs>
            <polygon points="100,30 175,160 25,160" fill="url(#bp)" opacity="0.6"
              stroke="rgba(255,255,255,0.7)" strokeWidth="1.5" strokeLinejoin="round"/>
          </svg>
        </div>
        <div className="brand-tagline">
          <h2 className="display">Prism</h2>
          <p>邮箱验证</p>
          <p className="mono">cost = price · always</p>
        </div>
      </div>

      <div className="auth-form">
        <h1 className="display">
          {state === 'loading' && '验证中…'}
          {state === 'ok' && '✓ 验证成功'}
          {state === 'err' && '✗ 验证失败'}
        </h1>

        <p style={{
          marginTop: '24px',
          padding: '16px',
          borderRadius: '12px',
          background: state === 'ok' ? 'rgba(16, 185, 129, 0.08)'
                    : state === 'err' ? 'rgba(239, 68, 68, 0.08)'
                    : 'rgba(99, 102, 241, 0.08)',
          border: state === 'ok' ? '1px solid rgba(16, 185, 129, 0.3)'
                : state === 'err' ? '1px solid rgba(239, 68, 68, 0.3)'
                : '1px solid rgba(99, 102, 241, 0.3)',
          color: 'var(--fg)',
          lineHeight: 1.6,
        }}>
          {message}
        </p>

        <div style={{ marginTop: '24px', display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
          {state === 'ok' && (
            <a className="cta-primary auth-submit" href="/login">立即登录</a>
          )}
          {state === 'err' && (
            <>
              <a className="cta-primary auth-submit" href="/login">尝试登录</a>
              <a className="cta-ghost" href="/signup">重新注册</a>
            </>
          )}
        </div>

        <p className="auth-mini" style={{ marginTop: '32px' }}>
          <a href="/suanli/">← 回首页</a>
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<VerifyEmailPage/>);
  </script>
</body>
</html>
