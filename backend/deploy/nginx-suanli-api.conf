# Prism API gateway 反代规则 — 加进 /etc/nginx/sites-enabled/pump-scanner
# 的 server { } 块里，位置在 `location /suanli/` 之后、`location /` 之前。
#
# 部署：
#   sudo cp deploy/nginx-suanli-api.conf /etc/nginx/snippets/
#   编辑 /etc/nginx/sites-enabled/pump-scanner，在 location /suanli/ 之后加：
#     include /etc/nginx/snippets/nginx-suanli-api.conf;
#   sudo nginx -t && sudo systemctl reload nginx

# ── /suanli-api/ — Prism API gateway 反代 ─────────────────
location /suanli-api/ {
    # Strip /suanli-api/ prefix when forwarding (so app sees /v1/messages etc.)
    proxy_pass http://127.0.0.1:8765/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # 流式 SSE 关键设置 — 不缓冲、不超时
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;       # 长上下文响应可能 5+ min
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;

    chunked_transfer_encoding on;
    proxy_set_header Connection "";

    # 大文件 / 长 prompt 上传
    client_max_body_size 16m;
}
